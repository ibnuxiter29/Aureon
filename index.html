<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUREON — Secure Communication Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============ RESET & ROOT ============ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --red:#ff1a35;
  --red-bright:#ff4257;
  --red-deep:#a30014;
  --bg:#050507;
  --panel:#0c0c11;
  --panel-2:#12121a;
  --line:rgba(255,26,53,.28);
  --line-soft:rgba(255,255,255,.07);
  --text:#eaeaf1;
  --muted:#8a8a99;
  --glow:0 0 30px rgba(255,26,53,.45);
  --ease:cubic-bezier(.19,1,.22,1);
}

html{scroll-behavior:smooth}

body{
  font-family:'Rajdhani',sans-serif;
  background:
    radial-gradient(1200px 620px at 82% -12%, rgba(255,26,53,.14), transparent 62%),
    radial-gradient(1000px 560px at -5% 105%, rgba(255,26,53,.09), transparent 62%),
    var(--bg);
  color:var(--text);
  overflow-x:hidden;
  position:relative;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ============ BACKGROUND LAYERS ============ */
.grid-bg{
  position:fixed;inset:-2px;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,26,53,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,26,53,.055) 1px, transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, #000 15%, transparent 78%);
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, #000 15%, transparent 78%);
  animation:gridDrift 24s linear infinite;
}
@keyframes gridDrift{
  from{background-position:0 0,0 0}
  to{background-position:64px 64px,64px 64px}
}

.scanlines{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(180deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px);
}

.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0,0,0,.75) 100%);
}

/* ============ LAYOUT ============ */
.container{width:100%;max-width:1220px;margin:0 auto;padding:0 26px;position:relative;z-index:3}
section{position:relative;z-index:3}

/* ============ NAVBAR ============ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:200;height:76px;
  display:flex;align-items:center;
  background:linear-gradient(180deg, rgba(5,5,7,.94), rgba(5,5,7,.55));
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-bottom:1px solid transparent;
  transition:border-color .45s var(--ease), background .45s var(--ease);
}
.nav.scrolled{border-bottom-color:var(--line);background:rgba(5,5,7,.94)}
.nav-inner{width:100%;max-width:1220px;margin:0 auto;padding:0 26px;display:flex;align-items:center;justify-content:space-between;gap:20px}

.brand{display:flex;align-items:center;gap:13px;text-decoration:none}
.brand-logo{
  width:40px;height:40px;object-fit:contain;
  filter:drop-shadow(0 0 12px rgba(255,26,53,.75));
  transition:transform .5s var(--ease);
}
.brand:hover .brand-logo{transform:scale(1.08) rotate(-4deg)}
.brand-name{
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:19px;
  letter-spacing:.22em;color:#fff;
  text-shadow:0 0 18px rgba(255,26,53,.6);
}

.nav-links{display:flex;align-items:center;gap:36px;list-style:none}
.nav-links a{
  position:relative;text-decoration:none;color:var(--muted);
  font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;
  padding:6px 0;transition:color .35s var(--ease);
}
.nav-links a::after{
  content:'';position:absolute;left:0;bottom:0;height:1px;width:0;
  background:var(--red);box-shadow:0 0 10px var(--red);
  transition:width .45s var(--ease);
}
.nav-links a:hover{color:#fff}
.nav-links a:hover::after{width:100%}

/* ============ BUTTONS ============ */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:11px;
  font-family:'Orbitron',sans-serif;font-weight:700;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;text-decoration:none;
  padding:16px 32px;border:none;cursor:pointer;overflow:hidden;
  transition:transform .4s var(--ease), box-shadow .4s var(--ease), background .4s var(--ease), color .4s var(--ease);
  clip-path:polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
}
.btn i{font-size:14px;position:relative;z-index:2}
.btn span{position:relative;z-index:2}

.btn-primary{
  background:linear-gradient(135deg, var(--red-bright) 0%, var(--red) 40%, var(--red-deep) 100%);
  color:#fff;
  box-shadow:0 0 26px rgba(255,26,53,.42), inset 0 0 22px rgba(255,255,255,.08);
}
.btn-primary::before{
  content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
  transform:skewX(-22deg);transition:left .75s var(--ease);
}
.btn-primary:hover::before{left:140%}
.btn-primary:hover{
  transform:translateY(-3px);
  box-shadow:0 0 46px rgba(255,26,53,.75), inset 0 0 26px rgba(255,255,255,.12);
}

.btn-ghost{
  background:rgba(255,26,53,.05);
  color:#dcdce6;
  border:1px solid rgba(255,255,255,.14);
}
.btn-ghost:hover{
  color:#fff;border-color:var(--red);
  background:rgba(255,26,53,.14);
  box-shadow:0 0 30px rgba(255,26,53,.3);
  transform:translateY(-3px);
}

.btn-sm{padding:12px 22px;font-size:10.5px}

/* ============ HERO ============ */
.hero{
  min-height:100vh;display:flex;align-items:center;
  padding:150px 0 90px;
}
.hero-grid{
  display:grid;grid-template-columns:1.05fr .95fr;
  gap:60px;align-items:center;
}

.hero-badge{
  display:inline-flex;align-items:center;gap:10px;
  padding:9px 18px;margin-bottom:28px;
  border:1px solid var(--line);
  background:rgba(255,26,53,.07);
  font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.26em;text-transform:uppercase;color:var(--red-bright);
  clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
}
.hero-badge i{font-size:12px;animation:pulseDot 2.2s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}

.hero h1{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(52px,8.5vw,104px);
  line-height:.95;letter-spacing:.02em;
  background:linear-gradient(180deg,#ffffff 0%,#ffb9c3 42%,var(--red) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 42px rgba(255,26,53,.4));
  margin-bottom:14px;
}
.hero-sub{
  font-family:'Orbitron',sans-serif;font-size:clamp(11px,1.5vw,14px);
  font-weight:700;letter-spacing:.42em;text-transform:uppercase;
  color:var(--red-bright);margin-bottom:26px;
  text-shadow:0 0 20px rgba(255,26,53,.55);
}
.hero-desc{
  font-size:17.5px;color:var(--muted);max-width:545px;
  margin-bottom:40px;font-weight:500;
}
.hero-desc strong{color:#fff;font-weight:600}

.hero-cta{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:52px}

.hero-stats{
  display:flex;flex-wrap:wrap;gap:14px;
}
.stat{
  flex:1 1 130px;padding:16px 20px;
  background:linear-gradient(160deg, rgba(20,20,27,.85), rgba(9,9,13,.85));
  border:1px solid var(--line-soft);
  border-left:2px solid var(--red);
  transition:.4s var(--ease);
}
.stat:hover{border-color:var(--line);border-left-color:var(--red-bright);transform:translateY(-4px);box-shadow:0 12px 34px rgba(255,26,53,.14)}
.stat-num{font-family:'Orbitron',sans-serif;font-size:19px;font-weight:900;color:#fff;letter-spacing:.04em}
.stat-label{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:2px}

/* --- Logo Stage --- */
.logo-stage{
  position:relative;width:100%;max-width:440px;aspect-ratio:1;
  margin:0 auto;display:grid;place-items:center;
}
.ring{
  position:absolute;border-radius:50%;pointer-events:none;
}
.ring-1{
  inset:0;
  background:conic-gradient(from 0deg, transparent 0deg, transparent 250deg, var(--red) 320deg, transparent 360deg);
  -webkit-mask:radial-gradient(circle, transparent 63%, #000 64%);
  mask:radial-gradient(circle, transparent 63%, #000 64%);
  animation:spin 7s linear infinite;
  filter:drop-shadow(0 0 12px rgba(255,26,53,.8));
}
.ring-2{
  inset:9%;
  background:conic-gradient(from 180deg, transparent 0deg, transparent 265deg, rgba(255,66,87,.85) 335deg, transparent 360deg);
  -webkit-mask:radial-gradient(circle, transparent 68%, #000 69%);
  mask:radial-gradient(circle, transparent 68%, #000 69%);
  animation:spin 11s linear infinite reverse;
}
.ring-3{
  inset:19%;border:1px dashed rgba(255,26,53,.32);
  animation:spin 34s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.logo-core{
  position:relative;width:56%;aspect-ratio:1;
  display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%, rgba(255,26,53,.24), rgba(10,10,14,.9) 68%);
  border:1px solid var(--line);
  border-radius:50%;
  box-shadow:0 0 70px rgba(255,26,53,.36), inset 0 0 60px rgba(255,26,53,.16);
  animation:corePulse 4.5s ease-in-out infinite;
}
@keyframes corePulse{
  0%,100%{box-shadow:0 0 62px rgba(255,26,53,.3), inset 0 0 55px rgba(255,26,53,.13)}
  50%{box-shadow:0 0 105px rgba(255,26,53,.55), inset 0 0 70px rgba(255,26,53,.22)}
}
.logo-core img{
  width:66%;height:66%;object-fit:contain;
  filter:drop-shadow(0 0 22px rgba(255,26,53,.9));
  animation:floatY 5.5s ease-in-out infinite;
}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

/* ============ TICKER ============ */
.ticker{
  position:relative;z-index:3;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:linear-gradient(90deg, rgba(255,26,53,.05), rgba(255,26,53,.01), rgba(255,26,53,.05));
  overflow:hidden;padding:15px 0;
}
.ticker-track{display:flex;gap:56px;width:max-content;animation:marquee 32s linear infinite}
.ticker-item{
  display:flex;align-items:center;gap:12px;
  font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.3em;text-transform:uppercase;color:#9a9aa8;white-space:nowrap;
}
.ticker-item i{color:var(--red);font-size:12px}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ============ SECTION HEADER ============ */
.section{padding:118px 0}
.section-head{max-width:720px;margin:0 auto 64px;text-align:center}
.section-tag{
  display:inline-flex;align-items:center;gap:10px;
  font-family:'Orbitron',sans-serif;font-size:10.5px;font-weight:700;
  letter-spacing:.32em;text-transform:uppercase;color:var(--red-bright);
  margin-bottom:20px;
}
.section-tag::before,.section-tag::after{
  content:'';width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--red));
}
.section-tag::after{background:linear-gradient(90deg,var(--red),transparent)}
.section h2{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(28px,4.4vw,46px);line-height:1.14;
  letter-spacing:.01em;color:#fff;margin-bottom:18px;
}
.section h2 em{
  font-style:normal;
  background:linear-gradient(180deg,#ff8f9d,var(--red));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.section-head p{color:var(--muted);font-size:17px;font-weight:500}

/* ============ CARDS GRID ============ */
.cards{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));
  gap:22px;
}
.card{
  position:relative;padding:36px 32px 34px;
  background:linear-gradient(160deg, rgba(21,21,28,.9), rgba(8,8,12,.92));
  border:1px solid var(--line-soft);
  clip-path:polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
  transition:transform .5s var(--ease), border-color .5s var(--ease), box-shadow .5s var(--ease);
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0;opacity:0;transition:opacity .5s var(--ease);
  background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%), rgba(255,26,53,.15), transparent 48%);
  pointer-events:none;
}
.card:hover::before{opacity:1}
.card:hover{
  transform:translateY(-8px);
  border-color:var(--line);
  box-shadow:0 22px 54px rgba(0,0,0,.62), 0 0 34px rgba(255,26,53,.14);
}
.card::after{
  content:'';position:absolute;top:0;left:0;width:0;height:2px;
  background:linear-gradient(90deg,var(--red),transparent);
  transition:width .6s var(--ease);
}
.card:hover::after{width:100%}

.card-icon{
  width:58px;height:58px;display:grid;place-items:center;
  margin-bottom:24px;font-size:22px;color:var(--red-bright);
  background:linear-gradient(150deg, rgba(255,26,53,.18), rgba(255,26,53,.03));
  border:1px solid var(--line);
  clip-path:polygon(0 0, calc(100% - 13px) 0, 100% 13px, 100% 100%, 13px 100%, 0 calc(100% - 13px));
  box-shadow:inset 0 0 22px rgba(255,26,53,.14);
  transition:.5s var(--ease);
}
.card:hover .card-icon{
  color:#fff;
  background:linear-gradient(150deg, var(--red), var(--red-deep));
  box-shadow:0 0 30px rgba(255,26,53,.55), inset 0 0 20px rgba(255,255,255,.14);
}
.card h3{
  font-family:'Orbitron',sans-serif;font-size:15.5px;font-weight:700;
  letter-spacing:.06em;color:#fff;margin-bottom:12px;line-height:1.35;
}
.card p{color:var(--muted);font-size:15.5px;font-weight:500}

/* ============ KELEBIHAN (ADVANTAGES) ============ */
.adv-wrap{
  display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;
}
.adv-list{display:flex;flex-direction:column;gap:0}
.adv-item{
  display:flex;gap:26px;padding:30px 0;
  border-bottom:1px solid var(--line-soft);
  transition:.45s var(--ease);
}
.adv-item:first-child{padding-top:0}
.adv-item:hover{padding-left:12px}
.adv-item:hover .adv-num{color:var(--red-bright);text-shadow:0 0 26px rgba(255,26,53,.85)}
.adv-num{
  font-family:'Orbitron',sans-serif;font-size:30px;font-weight:900;
  color:rgba(255,255,255,.14);line-height:1;min-width:64px;
  transition:.45s var(--ease);
}
.adv-body h4{
  font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;
  letter-spacing:.08em;color:#fff;margin-bottom:8px;
}
.adv-body p{color:var(--muted);font-size:15.5px;font-weight:500}

.adv-panel{
  position:relative;padding:48px 42px;
  background:linear-gradient(155deg, rgba(255,26,53,.10), rgba(9,9,13,.95) 55%);
  border:1px solid var(--line);
  clip-path:polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 26px 100%, 0 calc(100% - 26px));
  box-shadow:0 0 60px rgba(255,26,53,.10), inset 0 0 60px rgba(255,26,53,.05);
}
.adv-panel h3{
  font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;
  color:#fff;letter-spacing:.06em;margin-bottom:8px;
}
.adv-panel > p{color:var(--muted);font-size:15px;margin-bottom:30px}
.check-list{list-style:none;display:flex;flex-direction:column;gap:16px}
.check-list li{
  display:flex;align-items:flex-start;gap:14px;
  font-size:15.5px;font-weight:500;color:#c9c9d4;
}
.check-list li i{
  color:var(--red-bright);font-size:13px;margin-top:6px;
  filter:drop-shadow(0 0 8px rgba(255,26,53,.85));
}
.check-list li strong{color:#fff;font-weight:600}

/* ============ DOWNLOAD CTA ============ */
.cta-box{
  position:relative;text-align:center;padding:78px 40px 72px;
  background:
    radial-gradient(700px 320px at 50% 0%, rgba(255,26,53,.20), transparent 68%),
    linear-gradient(160deg, rgba(18,18,24,.96), rgba(7,7,10,.97));
  border:1px solid var(--line);
  clip-path:polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 30px 100%, 0 calc(100% - 30px));
  overflow:hidden;
}
.cta-box::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,26,53,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,26,53,.05) 1px, transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 50%, #000 10%, transparent 72%);
  mask-image:radial-gradient(ellipse at 50% 50%, #000 10%, transparent 72%);
}
.cta-logo{
  width:88px;height:88px;object-fit:contain;margin:0 auto 26px;display:block;
  filter:drop-shadow(0 0 30px rgba(255,26,53,.85));
  animation:floatY 5s ease-in-out infinite;
}
.cta-box h2{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(26px,4vw,42px);color:#fff;margin-bottom:16px;letter-spacing:.02em;
}
.cta-box h2 em{
  font-style:normal;
  background:linear-gradient(180deg,#ff9aa7,var(--red));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.cta-box > p{color:var(--muted);font-size:17px;max-width:600px;margin:0 auto 40px;font-weight:500}
.cta-actions{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;position:relative;z-index:2}

.platforms{
  display:flex;flex-wrap:wrap;gap:34px;justify-content:center;
  margin-top:52px;padding-top:36px;border-top:1px solid var(--line-soft);
  position:relative;z-index:2;
}
.platform{
  display:flex;align-items:center;gap:11px;
  font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  transition:.4s var(--ease);
}
.platform i{font-size:19px;color:#fff;transition:.4s var(--ease)}
.platform:hover{color:#fff}
.platform:hover i{color:var(--red-bright);filter:drop-shadow(0 0 12px rgba(255,26,53,.9))}

/* ============ FOOTER ============ */
.footer{
  position:relative;z-index:3;
  border-top:1px solid var(--line-soft);
  padding:56px 0 42px;
  background:linear-gradient(180deg, transparent, rgba(255,26,53,.04));
}
.footer-inner{
  display:flex;flex-wrap:wrap;gap:28px;
  align-items:center;justify-content:space-between;
}
.footer-brand{display:flex;align-items:center;gap:14px}
.footer-brand img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(255,26,53,.7))}
.footer-brand span{
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:16px;
  letter-spacing:.22em;color:#fff;
}
.footer-dev{
  font-size:14px;color:var(--muted);font-weight:500;letter-spacing:.04em;
}
.footer-dev b{
  color:var(--red-bright);font-weight:700;
  text-shadow:0 0 14px rgba(255,26,53,.6);
}
.footer-copy{font-size:13px;color:#5f5f6c;letter-spacing:.06em;font-weight:500}

.footer-line{
  height:2px;margin-top:38px;
  background:linear-gradient(90deg, transparent, var(--red), transparent);
  opacity:.55;
}

/* ============ REVEAL ANIMATION ============ */
.reveal{
  opacity:0;transform:translateY(34px);
  transition:opacity .9s var(--ease), transform .9s var(--ease);
}
.reveal.in{opacity:1;transform:none}

/* ============ RESPONSIVE ============ */
@media (max-width:1024px){
  .hero-grid{grid-template-columns:1fr;gap:56px;text-align:center}
  .hero-desc{margin-left:auto;margin-right:auto}
  .hero-cta,.hero-stats{justify-content:center}
  .logo-stage{max-width:360px;order:-1}
  .adv-wrap{grid-template-columns:1fr;gap:50px}
}
@media (max-width:768px){
  .nav-links{display:none}
  .hero{padding-top:120px}
  .section{padding:84px 0}
  .cta-box{padding:56px 24px}
  .adv-panel{padding:36px 26px}
  .footer-inner{flex-direction:column;text-align:center;gap:18px}
}
@media (max-width:480px){
  .btn{padding:14px 24px;font-size:10.5px}
  .hero-cta{flex-direction:column;width:100%}
  .hero-cta .btn{width:100%}
}
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="scanlines"></div>
